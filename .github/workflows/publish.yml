name: Publish posts

on:
  schedule:
    - cron: "7 * * * *"   # щогодини о :07 (UTC)
  workflow_dispatch: {}    # ручний запуск з вкладки Actions

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Publish due posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          MEDIA_BASE_URL: ${{ secrets.MEDIA_BASE_URL }}
        run: python publish.py
      - name: Save state
        if: always()
        run: |
          git config user.name "gerlite-bot"
          git config user.email "gerlite-bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || git commit -m "posted: update state"
          git push
